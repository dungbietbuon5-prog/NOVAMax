name: Build Unsigned IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4 

      - name: Auto Detect Project & Build Unsigned App
        run: |
          # 1. Tìm file .xcworkspace trước (thường được ưu tiên nếu có dùng CocoaPods)
          WORKSPACE_FILE=$(find . -name "*.xcworkspace" -not -path "*/project.xcworkspace/*" | head -n 1)
          
          # 2. Tìm file .xcodeproj (nếu không có workspace)
          PROJECT_FILE=$(find . -name "*.xcodeproj" | head -n 1)
          
          if [ -n "$WORKSPACE_FILE" ]; then
            echo "✅ Tìm thấy Workspace: $WORKSPACE_FILE"
            BUILD_FLAG="-workspace"
            BUILD_TARGET="$WORKSPACE_FILE"
            SCHEME_NAME=$(basename "$WORKSPACE_FILE" .xcworkspace)
          elif [ -n "$PROJECT_FILE" ]; then
            echo "✅ Tìm thấy Project: $PROJECT_FILE"
            BUILD_FLAG="-project"
            BUILD_TARGET="$PROJECT_FILE"
            SCHEME_NAME=$(basename "$PROJECT_FILE" .xcodeproj)
          else
            echo "❌ LỖI: Không tìm thấy file .xcodeproj hay .xcworkspace nào trong toàn bộ source code!"
            echo "Vui lòng kiểm tra lại xem mày đã up đúng source code chưa."
            exit 1
          fi
          
          echo "✅ Sử dụng Scheme mặc định: $SCHEME_NAME"
          
          # Build project
          xcodebuild clean build \
            $BUILD_FLAG "$BUILD_TARGET" \
            -scheme "$SCHEME_NAME" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package to IPA
        run: |
          # Tìm file .app vừa build xong
          APP_PATH=$(find ./build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "❌ LỖI: Build không tạo ra file .app!"
            exit 1
          fi
          
          echo "✅ Đã build thành công: $APP_PATH"
          
          # Đóng gói thành IPA
          mkdir -p ./build/Payload
          cp -r "$APP_PATH" ./build/Payload/
          cd ./build
          zip -r App_Unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4 
        with:
          name: Unsigned-IPA
          path: ./build/App_Unsigned.ipa
