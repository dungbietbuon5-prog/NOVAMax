name: Build Unsigned IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4 

      - name: Auto Detect Project & Build Unsigned App
        run: |
          # Tự động tìm file .xcodeproj đầu tiên trong thư mục
          PROJECT_FILE=$(find . -name "*.xcodeproj" -maxdepth 2 | head -n 1)
          
          if [ -z "$PROJECT_FILE" ]; then
            echo "❌ Không tìm thấy file .xcodeproj nào trong source code!"
            exit 1
          fi
          
          echo "✅ Tìm thấy Project: $PROJECT_FILE"
          
          # Lấy tên scheme mặc định dựa trên tên project
          SCHEME_NAME=$(basename "$PROJECT_FILE" .xcodeproj)
          echo "✅ Sử dụng Scheme: $SCHEME_NAME"
          
          # Build project
          xcodebuild clean build \
            -project "$PROJECT_FILE" \
            -scheme "$SCHEME_NAME" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package to IPA
        run: |
          # Tìm file .app vừa build xong
          APP_PATH=$(find ./build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "❌ Không tìm thấy file .app sau khi build!"
            exit 1
          fi
          
          echo "✅ Đã build thành công: $APP_PATH"
          
          # Đóng gói thành IPA
          mkdir -p ./build/Payload
          cp -r "$APP_PATH" ./build/Payload/
          cd ./build
          zip -r App_Unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4 
        with:
          name: Unsigned-IPA
          path: ./build/App_Unsigned.ipa
