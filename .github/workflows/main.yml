name: Build Unsigned IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Cho phép bấm chạy bằng tay từ tab Actions

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4 # Đã nâng cấp lên v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.0.app

      - name: Build Unsigned App
        run: |
          # Build project (Không ký)
          # LƯU Ý: Sửa "Tên_Project_Cua_May" và "Tên_Scheme" cho đúng với source của mày
          xcodebuild clean build \
            -project "Tên_Project_Cua_May.xcodeproj" \
            -scheme "Tên_Scheme" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package to IPA
        run: |
          # Tạo thư mục Payload
          mkdir -p ./build/Payload
          
          # Copy file .app vào thư mục Payload
          # LƯU Ý: Sửa "Tên_App.app" thành tên file .app thực tế của mày
          cp -r ./build/Build/Products/Release-iphoneos/Tên_App.app ./build/Payload/
          
          # Nén thành file .ipa
          cd ./build
          zip -r App_Unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4 # Đã nâng cấp lên v4 để fix lỗi của GitHub
        with:
          name: Unsigned-IPA
          path: ./build/App_Unsigned.ipa
