name: Build Unsigned IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4 

      - name: Auto Extract and Build
        run: |
          echo "🔍 Đang quét thư mục để tìm source code..."

          # 1. Tìm file nén
          ARCHIVE_FILE=$(find . -maxdepth 2 -type f \( -name "*.zip" -o -name "*.ipa" \) | head -n 1)

          if [ -n "$ARCHIVE_FILE" ]; then
            echo "📦 Tìm thấy file nén: $ARCHIVE_FILE. Tiến hành giải nén..."
            mkdir -p ./extracted
            unzip -q "$ARCHIVE_FILE" -d ./extracted || true
            
            # XÓA THƯ MỤC RÁC CỦA MAC
            echo "🧹 Đang dọn dẹp thư mục rác __MACOSX và file .DS_Store..."
            find ./extracted -name "__MACOSX" -type d -exec rm -rf {} + 2>/dev/null || true
            find ./extracted -name ".DS_Store" -type f -delete 2>/dev/null || true
          else
            echo "📂 Không có file nén. Copy source code..."
            mkdir -p ./extracted
            cp -r ./* ./extracted/
          fi

          cd ./extracted

          # 2. Tìm file dự án Xcode (Bỏ qua mọi thư mục rác)
          WORKSPACE_FILE=$(find . -name "*.xcworkspace" -not -path "*__MACOSX*" -not -path "*/project.xcworkspace/*" | head -n 1)
          PROJECT_FILE=$(find . -name "*.xcodeproj" -not -path "*__MACOSX*" | head -n 1)

          if [ -n "$WORKSPACE_FILE" ]; then
            BUILD_FLAG="-workspace"
            BUILD_TARGET="$WORKSPACE_FILE"
            echo "✅ Tìm thấy Workspace: $BUILD_TARGET"
          elif [ -n "$PROJECT_FILE" ]; then
            BUILD_FLAG="-project"
            BUILD_TARGET="$PROJECT_FILE"
            echo "✅ Tìm thấy Project: $BUILD_TARGET"
          else
            echo "❌ LỖI: Không tìm thấy file .xcodeproj hay .xcworkspace!"
            exit 1
          fi
          
          # 3. Tìm Scheme tự động
          echo "🔍 Đang tìm danh sách các Scheme..."
          SCHEMES=$(xcodebuild -list $BUILD_FLAG "$BUILD_TARGET" | awk '/Schemes:/{flag=1; next} /^$/{flag=0} flag')
          
          if [ -z "$SCHEMES" ]; then
            echo "❌ Không tìm thấy Scheme nào trong Project!"
            exit 1
          fi
          
          # Lấy Scheme đầu tiên tìm được
          SCHEME_NAME=$(echo "$SCHEMES" | head -n 1 | xargs)
          echo "✅ Sử dụng Scheme: $SCHEME_NAME"
          
          # 4. Build project và bắt log lỗi chi tiết nếu thất bại
          set -o pipefail
          xcodebuild clean build \
            $BUILD_FLAG "$BUILD_TARGET" \
            -scheme "$SCHEME_NAME" \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_ENTITLEMENTS="" \
            PROVISIONING_PROFILE_SPECIFIER="" | tee xcode_build.log || {
              echo "=========================================="
              echo "❌ PHÁT HIỆN LỖI BUILD! CÁC DÒNG LỖI CHI TIẾT:"
              echo "=========================================="
              grep -i "error:" xcode_build.log || true
              echo "=========================================="
              exit 1
            }

      - name: Package to IPA
        run: |
          cd ./extracted
          
          APP_PATH=$(find ./build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "❌ Lỗi: Không tìm thấy file .app sau khi build!"
            exit 1
          fi
          
          mkdir -p ./build/Payload
          cp -r "$APP_PATH" ./build/Payload/
          
          # ==========================================
          # NHÚNG TRỰC TIẾP THƯ MỤC PATCHES VÀO GÓI .APP
          # ==========================================
          TARGET_APP_NAME=$(basename "$APP_PATH")
          if [ -d "Patches" ]; then
            echo "📦 Tìm thấy thư mục Patches, đang nhúng vào .app..."
            cp -R Patches "./build/Payload/$TARGET_APP_NAME/"
          elif [ -d "ThreeOneOSFive/Patches" ]; then
            echo "📦 Tìm thấy thư mục ThreeOneOSFive/Patches, đang nhúng vào .app..."
            cp -R ThreeOneOSFive/Patches "./build/Payload/$TARGET_APP_NAME/Patches"
          else
            echo "⚠️ Cảnh báo: Không tìm thấy thư mục Patches!"
          fi
          
          cd ./build
          zip -qr App_Unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4 
        with:
          name: Unsigned-IPA
          path: ./extracted/build/App_Unsigned.ipa
