name: Build Unsigned IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4 

      - name: Auto Extract and Build
        run: |
          echo "🔍 Đang quét thư mục để tìm source code..."

          # 1. Kiểm tra nếu mày up file nén .zip hoặc .ipa hoặc .deb lên
          ARCHIVE_FILE=$(find . -maxdepth 2 -type f \( -name "*.zip" -o -name "*.ipa" -o -name "*.deb" \) | head -n 1)

          if [ -n "$ARCHIVE_FILE" ]; then
            echo "📦 Tìm thấy file nén: $ARCHIVE_FILE. Tiến hành giải nén..."
            mkdir -p ./extracted
            # Giải nén file
            unzip -q "$ARCHIVE_FILE" -d ./extracted || true
          else
            echo "📂 Không có file nén. Tìm source code trực tiếp..."
            mkdir -p ./extracted
            cp -r ./* ./extracted/
          fi

          cd ./extracted

          # 2. Tìm file dự án Xcode
          WORKSPACE_FILE=$(find . -name "*.xcworkspace" -not -path "*/project.xcworkspace/*" | head -n 1)
          PROJECT_FILE=$(find . -name "*.xcodeproj" | head -n 1)

          if [ -n "$WORKSPACE_FILE" ]; then
            echo "✅ Tìm thấy Workspace: $WORKSPACE_FILE"
            BUILD_FLAG="-workspace"
            BUILD_TARGET="$WORKSPACE_FILE"
            SCHEME_NAME=$(basename "$WORKSPACE_FILE" .xcworkspace)
          elif [ -n "$PROJECT_FILE" ]; then
            echo "✅ Tìm thấy Project: $PROJECT_FILE"
            BUILD_FLAG="-project"
            BUILD_TARGET="$PROJECT_FILE"
            SCHEME_NAME=$(basename "$PROJECT_FILE" .xcodeproj)
          else
            echo "❌ LỖI NGHIÊM TRỌNG: Không tìm thấy file .xcodeproj hay .xcworkspace nào trong toàn bộ source code!"
            echo "Lý do: Mày đang up file .ipa/.zip/.deb đã build sẵn, hoặc up thiếu file Project Xcode."
            exit 1
          fi
          
          echo "🔨 Bắt đầu build với Scheme: $SCHEME_NAME"
          
          # 3. Build project
          xcodebuild clean build \
            $BUILD_FLAG "$BUILD_TARGET" \
            -scheme "$SCHEME_NAME" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package to IPA
        run: |
          cd ./extracted
          
          # 4. Đóng gói file .app thành .ipa
          APP_PATH=$(find ./build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "❌ Lỗi: Không tìm thấy file .app sau khi build!"
            exit 1
          fi
          
          mkdir -p ./build/Payload
          cp -r "$APP_PATH" ./build/Payload/
          cd ./build
          zip -r App_Unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4 
        with:
          name: Unsigned-IPA
          path: ./extracted/build/App_Unsigned.ipa
