name: Build Unsigned IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4 

      - name: Build Unsigned App
        run: |
          # Build project (Không ký)
          # LƯU Ý: Sửa "Tên_Project_Cua_May" và "Tên_Scheme" cho đúng với source của mày
          xcodebuild clean build \
            -project "Tên_Project_Cua_May.xcodeproj" \
            -scheme "Tên_Scheme" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package to IPA
        run: |
          mkdir -p ./build/Payload
          # LƯU Ý: Sửa "Tên_App.app" thành tên file app thực tế
          cp -r ./build/Build/Products/Release-iphoneos/Tên_App.app ./build/Payload/
          cd ./build
          zip -r App_Unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4 
        with:
          name: Unsigned-IPA
          path: ./build/App_Unsigned.ipa
