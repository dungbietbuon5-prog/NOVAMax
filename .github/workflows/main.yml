name: Build Unsigned IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4 

      - name: Select Xcode
        # Đã sửa lại đường dẫn Xcode mới nhất để không bị lỗi
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Build Unsigned App
        run: |
          # LƯU Ý: Sửa tên project và scheme của mày vào đây
          xcodebuild clean build \
            -project "Tên_Project_Cua_May.xcodeproj" \
            -scheme "Tên_Scheme" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package to IPA
        run: |
          mkdir -p ./build/Payload
          # LƯU Ý: Sửa tên file app của mày
          cp -r ./build/Build/Products/Release-iphoneos/Tên_App.app ./build/Payload/
          cd ./build
          zip -r App_Unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4 
        with:
          name: Unsigned-IPA
          path: ./build/App_Unsigned.ipa
